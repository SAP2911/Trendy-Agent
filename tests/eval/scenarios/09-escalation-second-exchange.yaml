# Escalation (2/2).
# §4.4: one exchange per item; a second exchange request on the same item
# requires human approval.
#
# This is a TWO-TURN scenario on purpose. The first version asserted on a
# single turn where the customer merely *claimed* a prior exchange — but the
# store starts empty in every scenario, so there was nothing for the system to
# detect and the assertion tested the model's credulity rather than the policy.
# Turn 1 now actually creates the first exchange; turn 2 requests a different
# size on the same item, which is the real §4.4 trigger.
id: escalation-second-exchange
category: escalation
description: >
  First size exchange succeeds. A second exchange on the same item must be
  refused by the tool (SECOND_EXCHANGE_NEEDS_APPROVAL) and routed to a human
  per §4.4, never silently filed as another exchange.
turns:
  - message: >
      My email is diego.ramos@example.com. I'd like to exchange the Oxford
      Shirt from order TR-4528 for a size L.
    expect:
      toolCalls: [verify_customer, initiate_exchange]
      resultCodes: [VERIFIED, EXCHANGE_CREATED]

  - message: >
      Actually L is still not right — can I swap it again for an XL?
    expect:
      resultCodes: [SECOND_EXCHANGE_NEEDS_APPROVAL]
      citedClauses: ["4.4"]
      forbidden:
        # It must not claim a second exchange record was created.
        - "EXC-0000[2-9]"
